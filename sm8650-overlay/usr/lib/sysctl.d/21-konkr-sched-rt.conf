# From the Steam Frame build 20260925 (steamos-customizations-deckard
# 20-sched.conf, same SoC family): realtime threads (PipeWire's audio loops)
# no longer ask for the full CPU clock, so cores can clock down while sound
# plays. Pocket FIT, speaker tone playing: 2.66-2.72 W vs 2.86-3.13 W at the
# kernel default of 1024. Harmless once the base image ships it too.
kernel.sched_util_clamp_min_rt_default = 64
