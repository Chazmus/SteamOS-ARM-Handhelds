# Let sm8550-audio-setup (alsaucm + speaker levels) finish before WirePlumber
# opens the card; both setting it up at once left the speakers silent on some
# boots. The setup starts when the card appears and marks /run when done.
# Capped so a missing card never holds the session: Steam and gamescope don't
# wait for WirePlumber anyway.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ ! -e /run/sm8550-audio-ready ] && [ $i -lt 60 ]; do sleep 0.25; i=$((i+1)); done'
