# Frame's microphone-tracker.lua parses default.audio.source without a nil
# check. The Pocket FIT has no default source, so WirePlumber segfaults on
# every start and there is no sound. It only switches the echo-cancel
# filters for Frame's mic loopback nodes, which don't exist here.
wireplumber.profiles = {
  main = {
    steamos.microphone-tracker = disabled
  }
}
