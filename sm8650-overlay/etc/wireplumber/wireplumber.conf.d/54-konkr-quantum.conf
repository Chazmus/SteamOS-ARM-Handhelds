# KONKR Pocket FIT: fixed quantum and interrupt-driven playback on the
# internal card.
#
# The q6apm DSP reports its playback position only in 10 ms steps (480
# frames) and reads ahead of it. With PipeWire's default timer scheduling it
# writes just ahead of that coarse position, so short, sharp sounds (the
# Steam menu clicks) sometimes played before they were written and stuttered.
# Waking on the period interrupt and writing whole periods fixes it. Period
# and quantum are both 960 frames (two DSP steps, 20 ms), so each wakeup is
# exactly one DSP-aligned period.
#
# 512 forced every client, including FEX-emulated games that cannot always
# refill 10 ms in time, into tiny buffers and they crackled, so the quantum
# stays around 20 ms. It is fixed, not dynamic: quantum switches glitch on
# this DSP.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" } ]
    actions = {
      update-props = {
        node.force-quantum = 960
        api.alsa.disable-tsched = true
        api.alsa.period-size = 960
        api.alsa.period-num = 4
      }
    }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-sound.*" } ]
    actions = { update-props = { node.force-quantum = 960 } }
  }
]
