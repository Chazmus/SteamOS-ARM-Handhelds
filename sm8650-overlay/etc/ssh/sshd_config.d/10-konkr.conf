# SSH is off by default. To reach the device from a PC:
#   passwd                              (set a password for steamos first)
#   sudo systemctl enable --now sshd
#   ssh steamos@<device-ip>
# Root login is off; use sudo. Turn it off again with: sudo systemctl disable --now sshd
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitRootLogin no
