# Promote and publish a tested SteamOS Odin 3 image artifact to a GitHub Release.
#
# Decoupled from build-image.yml so images can be downloaded, flashed to hardware,
# and verified before being published to the public.
#
# Release tag convention: v*8elite* (e.g. v1.3-8elite-beta2)
name: Publish Odin 3 Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: >-
          Release tag name (e.g. v1.3-8elite-beta2)
        required: true
        type: string
      image_run_id:
        description: >-
          Run ID of the build-image workflow to release (leave blank for latest successful build)
        required: false
        type: string
      release_title:
        description: >-
          Release title (leave blank to default to tag name)
        required: false
        type: string
      prerelease:
        description: >-
          Mark as pre-release
        type: boolean
        default: true
      draft:
        description: >-
          Save as draft
        type: boolean
        default: false

jobs:
  publish-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Validate tag format
        run: |
          TAG="${{ inputs.tag_name }}"
          echo "Release tag: $TAG"
          if [[ ! "$TAG" =~ 8elite ]]; then
            echo "::warning::Tag '$TAG' does not contain '8elite'. The standard Odin 3 convention is 'v*8elite*' (e.g. v1.3-8elite-beta2)."
          fi

      - name: Determine image run ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.image_run_id }}" ]; then
            RUN_ID="${{ inputs.image_run_id }}"
            echo "Using specified image run ID: $RUN_ID"
          else
            echo "Finding latest successful build-image.yml run..."
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow=build-image.yml \
              --status=success --limit=1 \
              --json databaseId -q '.[0].databaseId')
            echo "Latest successful image run ID: $RUN_ID"
          fi

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful build-image.yml run found. Run build-image.yml first."
            exit 1
          fi

          echo "IMAGE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download image artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Downloading artifact from run $IMAGE_RUN_ID..."
          mkdir -p ./download
          gh run download "$IMAGE_RUN_ID" \
            --repo "${{ github.repository }}" \
            -n steamos-odin3-image \
            -D ./download/
          ls -la ./download/

      - name: Prepare release assets
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ ! -f ./download/steamos-odin3.img.zst ]; then
            echo "::error::Artifact steamos-odin3.img.zst not found in run $IMAGE_RUN_ID!"
            exit 1
          fi

          RELEASE_IMG="steamos-odin3-${TAG}.img.zst"
          RELEASE_SHA="${RELEASE_IMG}.sha256"

          cp ./download/steamos-odin3.img.zst "./${RELEASE_IMG}"
          sha256sum "${RELEASE_IMG}" > "${RELEASE_SHA}"

          IMG_SIZE=$(du -h "${RELEASE_IMG}" | cut -f1)
          SHA_VAL=$(cat "${RELEASE_SHA}")

          echo "RELEASE_IMG=${RELEASE_IMG}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${RELEASE_SHA}" >> "$GITHUB_ENV"

          echo "### Release Assets Prepared" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag:** \`${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Source Run:** [\`${IMAGE_RUN_ID}\`](https://github.com/${{ github.repository }}/actions/runs/${IMAGE_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image Asset:** \`${RELEASE_IMG}\` (${IMG_SIZE})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA256:** \`${SHA_VAL}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag_name }}"
          TITLE="${{ inputs.release_title }}"
          [ -z "$TITLE" ] && TITLE="$TAG"

          FLAGS=()
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          if [ "${{ inputs.draft }}" = "true" ]; then
            FLAGS+=(--draft)
          fi

          echo "Publishing release '$TAG' ($TITLE)..."

          # Upload to existing release if present, otherwise create new release
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading assets..."
            gh release upload "$TAG" "$RELEASE_IMG" "$RELEASE_SHA" \
              --repo "${{ github.repository }}" \
              --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$RELEASE_IMG" "$RELEASE_SHA" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --generate-notes \
              "${FLAGS[@]}"
          fi

          RELEASE_URL=$(gh release view "$TAG" --repo "${{ github.repository }}" --json url -q .url)
          echo "### Published!" >> "$GITHUB_STEP_SUMMARY"
          echo "View release: [${TAG}](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
