# Build the final flashable SteamOS Odin 3 image.
#
# Depends on pre-built artifacts from build-kernel.yml and build-mesa.yml.
# Run those first, then trigger this workflow.
#
# MVP: no Steam ARM seed — first boot downloads Steam (~10 min black screen).
name: Build Odin 3 Image

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: >-
          Kernel source: 'prebuilt' (official ROCKNIX 7.2.0, tested & verified) or 'source' (custom built artifact)
        required: false
        default: 'prebuilt'
        type: choice
        options:
          - prebuilt
          - source
      kernel_run_id:
        description: >-
          Kernel build run ID (only used if kernel_source is 'source'; leave blank for latest)
        required: false
      mesa_run_id:
        description: >-
          Mesa build run ID (leave blank for latest successful)
        required: false
  push:
    branches:
      - 'ci/github-actions-mvp'  # TODO: remove after CI is validated
    paths:
      - '.github/workflows/build-image.yml'

jobs:
  build-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read

    env:
      STEAMOS_WORK: ${{ github.workspace }}/sm8750-work
      STEAMOS_BUILD: '20260925.6175226'
      STEAMOS_BUNDLE: 'deckard-20260925.6175226-0.5.0'

    steps:
      - name: Free up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/az
          sudo docker image prune -af 2>/dev/null || true
          echo "=== After cleanup ==="
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            squashfs-tools dosfstools e2fsprogs fdisk uuid-runtime \
            rsync curl python3 python3-requests python3-zstandard zstd \
            gcc-aarch64-linux-gnu

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load version manifest
        run: |
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' \
              -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
              -e 's/"//g' -e "s/'//g" versions.env >> "$GITHUB_ENV"

      # ── Download custom kernel (only if source kernel requested) ─────
      - name: Download kernel artifact
        if: ${{ inputs.kernel_source == 'source' || inputs.kernel_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.kernel_run_id }}" ]; then
            RUN_ID="${{ inputs.kernel_run_id }}"
          else
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow=build-kernel.yml \
              --status=success --limit=1 \
              --json databaseId -q '.[0].databaseId')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful build-kernel.yml run found. Run the kernel workflow first."
            exit 1
          fi
          echo "Downloading kernel from run $RUN_ID"
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            -n kernel-sm8750 \
            -D ./kernel-download/

      - name: Stage custom kernel
        if: ${{ inputs.kernel_source == 'source' || inputs.kernel_run_id != '' }}
        run: |
          # The kernel build (SM8750_KERNEL=source) produces output in a
          # release-named directory (e.g. 7.2.0-sm8750-steamos). Create the
          # structure that ensure_kernel() expects for the source path.
          KWORK="${STEAMOS_WORK}/kernel-sm8750-src"
          mkdir -p "$KWORK/output/tmp"
          tar -xzf kernel-download/kernel-sm8750.tar.gz -C "$KWORK/output/tmp"
          # Discover the exact kernel release name from the modules directory:
          KREL="$(basename "$KWORK/output/tmp/modules/"*)"
          echo "Kernel release detected: $KREL"
          KREL_DIR="$KWORK/output/$KREL"
          rm -rf "$KREL_DIR"
          mv "$KWORK/output/tmp" "$KREL_DIR"
          # Create the 'current' symlink that ensure_kernel looks for
          ln -sfn "$KREL" "$KWORK/output/current"
          echo "Kernel staged at $KREL_DIR"
          ls -la "$KREL_DIR/boot/"
          echo "Kernel config FTRACE check:"
          grep -c 'CONFIG_FTRACE=y' "$KREL_DIR"/config-* || echo "No config file (prebuilt kernel)"

      # ── Download pre-built Mesa stack ────────────────────────────────
      - name: Download Mesa artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.mesa_run_id }}" ]; then
            RUN_ID="${{ inputs.mesa_run_id }}"
          else
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow=build-mesa.yml \
              --status=success --limit=1 \
              --json databaseId -q '.[0].databaseId')
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::error::No successful build-mesa.yml run found. Run the Mesa workflow first."
            exit 1
          fi
          echo "Downloading Mesa from run $RUN_ID"
          gh run download "$RUN_ID" \
            --repo "${{ github.repository }}" \
            -n mesa-sm8750 \
            -D ./mesa-download/

      - name: Stage Mesa stack
        run: |
          MESA_DIR="${STEAMOS_WORK}/mesa-stack"
          mkdir -p "$MESA_DIR"
          tar -xf mesa-download/mesa-sm8750.tar.zst --zstd -C "$MESA_DIR"
          rm -rf ./mesa-download
          echo "Mesa staged at $MESA_DIR"
          ls -la "$MESA_DIR/"
          echo "=== Disk after staging ==="
          df -h /

      # ── Download pre-built Steam ARM seed ────────────────────────────
      - name: Download Steam ARM seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ./seed-download
          SEED_REPO="${STEAM_SEED_REPO:-${{ github.repository }}}"
          SEED_TAG="${STEAM_SEED_TAG:-steam-seed-v1}"
          echo "Attempting to download Steam ARM seed from ${SEED_REPO} (tag: ${SEED_TAG})..."

          DOWNLOADED=0
          if gh release download "${SEED_TAG}" \
               --pattern "steam-arm-seed.tar.zst" \
               --repo "${SEED_REPO}" \
               -D ./seed-download/; then
            DOWNLOADED=1
          elif curl -fsSL -o ./seed-download/steam-arm-seed.tar.zst \
                 "https://github.com/${SEED_REPO}/releases/download/${SEED_TAG}/steam-arm-seed.tar.zst"; then
            DOWNLOADED=1
          fi

          if [ "$DOWNLOADED" -eq 1 ] && [ -f ./seed-download/steam-arm-seed.tar.zst ]; then
            echo "Downloaded steam-arm-seed.tar.zst"
            tar -xf ./seed-download/steam-arm-seed.tar.zst --zstd -C "${STEAMOS_WORK}"
            rm -rf ./seed-download
            echo "Steam seed staged at ${STEAMOS_WORK}/steam-arm-seed"
            ls -la "${STEAMOS_WORK}/steam-arm-seed/"
          else
            echo "::warning::Steam seed release not found; build will use fallback bootstrap"
          fi
          echo "=== Disk after seed staging ==="
          df -h /

      # ── Build the image ──────────────────────────────────────────────
      - name: Build SteamOS Odin 3 image
        run: |
          if [ "${{ inputs.kernel_source }}" = "source" ] || [ -n "${{ inputs.kernel_run_id }}" ]; then
            export SM8750_KERNEL=source
            export SM8750_KERNEL_WORK="${STEAMOS_WORK}/kernel-sm8750-src"
            echo "Using custom built kernel from source"
          else
            export SM8750_KERNEL=prebuilt
            echo "Using official verified ROCKNIX prebuilt kernel"
          fi
          export MESA_STACK="${STEAMOS_WORK}/mesa-stack"
          if [ -d "${STEAMOS_WORK}/steam-arm-seed" ]; then
            export STEAM_ARM_SEED="${STEAMOS_WORK}/steam-arm-seed"
            echo "Using STEAM_ARM_SEED=$STEAM_ARM_SEED"
          fi
          ./make-steamos-sm8750.sh

      - name: Check disk after build
        if: always()
        run: df -h /

      # ── Compress and upload ──────────────────────────────────────────
      - name: Compress image
        run: |
          IMG="${STEAMOS_WORK}/steamos-odin3.img"
          echo "Compressing $IMG ..."
          ls -lh "$IMG"
          zstd -T0 -3 "$IMG" -o steamos-odin3.img.zst
          ls -lh steamos-odin3.img.zst
          sha256sum steamos-odin3.img.zst > steamos-odin3.img.zst.sha256

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: steamos-odin3-image
          path: |
            steamos-odin3.img.zst
            steamos-odin3.img.zst.sha256
          retention-days: 14
          compression-level: 0  # already zstd compressed
