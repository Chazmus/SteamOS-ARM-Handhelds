# Use case configuration for the KONKR Pocket FIT Elite (SM8750, card SM8750-KONKR)
# Based on the AYN Odin 3 config by Teguh Sobirin <teguh@sobir.in>: the Elite
# card has the same links (0 MI2S speaker amps, 1 WCD headphones, 2 WCD mic).

Syntax 4

SectionUseCase."HiFi" {
	File "/KONKR/PocketFitElite/HiFi.conf"
	Comment "HiFi quality Music."
}

BootSequence [
	cset "name='RX_RX0 Digital Volume' 84"
	cset "name='RX_RX1 Digital Volume' 84"
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"
	cset "name='ADC2 Volume' 10"
]

LibraryConfig.remap.Config {

	ctl.default.map {
		"name='HP Volume'" {
			"name='HPHL Volume'".vindex.0 0
			"name='HPHR Volume'".vindex.1 0
		}
	}
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd939x/init.conf"
