# Force 90-degree clockwise rotation for AYN Odin 3 portrait AMOLED panel
GAMESCOPE_ORIENTATION=right

# Steam's performance overlay (mangoapp, GL through zink) shut the Odin 3
# down when turned on in a game. Off until that's fixed: Steam then uses
# the in-game MangoHud overlay (Vulkan) instead.
GAMESCOPE_MANGOAPP=0
