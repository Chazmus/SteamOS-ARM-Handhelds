# odin3d — AYN Odin 3 (Snapdragon 8 Elite / SM8750) Platform Daemon Config
# System service: sudo systemctl restart odin3d
# CLI management: odin3ctl status | profile | fan | rgb

[general]
# Logging verbosity: info, debug, warning
log_level = info

[fan]
enabled = yes
# PWM bounds: 0 to 255
min_pwm = 0
max_pwm = 255
# Failsafe PWM written if odin3d stops or crashes
failsafe_pwm = 150
# Poll interval in seconds
poll_interval_s = 1.0
# Exponential smoothing factor for temperature readings (0.0 to 1.0)
temp_smoothing = 0.15
# Hysteresis in °C: drop temperature threshold before stepping fan down
hysteresis_c = 3.0
# Maximum PWM step down per second to prevent annoying fan speed pulsing
ramp_down_step = 15
# Critical temperature threshold: immediately ramp to 100% fan speed
critical_temp_c = 88.0
critical_exit_c = 78.0

[curves]
# Fan curves: temperature_c:pwm_val pairs (0..255)
# Quiet/silent profile: keeps fan off or low until 55°C, ramps up under load
silent = 48:0, 55:30, 65:55, 75:90, 85:160, 92:255
# Balanced profile (default): quiet at idle, responsive cooling in games
balanced = 45:0, 50:35, 60:65, 70:105, 80:165, 88:220, 93:255
# Turbo profile: aggressive airflow for heavy emulation and AAA PC gaming
turbo = 40:70, 50:100, 60:140, 70:190, 80:235, 86:255

[power]
# Manage CPU frequency scaling governors (schedutil vs performance)
manage_cpu = yes
# Manage GPU devfreq polling and frequency range
manage_gpu = yes
