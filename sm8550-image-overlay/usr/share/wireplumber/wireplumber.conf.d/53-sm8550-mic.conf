# The Frame puts every built-in mic behind a loopback node for its own mic
# processing. On 8 Gen 2 recording through that loopback got PipeWire killed
# over and over as soon as something opened the mic (a Discord call), taking
# all audio down. Use the ALSA capture directly.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.platform-sound.*" } ]
    actions = { update-props = { node.create-loopback = false } }
  }
]
