# REDMAGIC 6: its UCM (Nubia/NX669J) has a single profile, "HiFi" (Speaker).
# 51-sm8550-hifi-priority and 53-konkr-audio match every platform-sound card
# and only name the Odin/KONKR profiles ("HiFi (Headphones, Speaker)", ...),
# so on a fresh install WirePlumber fell back to pro-audio: raw PCMs without
# the UCM mixer path, and no sound from the speakers.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" alsa.long_card_name = "REDMAGIC 6" }
    ]
    actions = {
      update-props = {
        priorities = [ "HiFi" ]
      }
    }
  }
]

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" alsa.long_card_name = "REDMAGIC 6" }
    ]
    actions = {
      update-props = {
        device.profile = "HiFi"
      }
    }
  }
]
