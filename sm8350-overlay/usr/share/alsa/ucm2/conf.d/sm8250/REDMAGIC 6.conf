# Use case configuration for the REDMAGIC 6 (Nubia NX669J)

Syntax 4

SectionUseCase."HiFi" {
	File "/Nubia/NX669J/HiFi.conf"
	Comment "HiFi quality Music."
}

# Stock speaker path: digital gain 56 (-2 dB), speaker gain 5 (+18 dB)
BootSequence [
	cset "name='Speaker Left Digital Volume' 56"
	cset "name='Speaker Right Digital Volume' 56"
	cset "name='Speaker Left Speaker Volume' 5"
	cset "name='Speaker Right Speaker Volume' 5"
]
