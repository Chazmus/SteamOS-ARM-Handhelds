# REDMAGIC 6: hci0 is an unconfigured controller (no address) until
# nx669j-bt-addr sets one, so bluetoothd has no adapter to power before
# that. And never fall back to `hciconfig hci0 up` (see nx669j-bt-power).
[Unit]
After=nx669j-bt-addr.service

[Service]
ExecStart=
ExecStart=/bin/bash /usr/lib/steamos-arm/nx669j-bt-power
