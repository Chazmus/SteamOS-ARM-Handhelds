# Legion Tab Gen 3 (TB321FU) HiFi verb.
#
# PCM 0 (MultiMedia1) -> WCD939x headphones, PCM 1 (MultiMedia2) -> the two
# AW882xx amps on Secondary TDM, PCM 2 (MultiMedia3) <- microphones.
# Every frontend is wired up when the verb starts, so PipeWire can open each
# PCM while it probes; the devices below only turn codecs and amps on/off.
# Speakers and headphones are separate PCMs, so they never fight over one.

SectionVerb {
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='SEC_TDM_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
		PlaybackCTL "hw:LenovoY700TB321"
		CaptureCTL "hw:LenovoY700TB321"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='aw882xx_rx_switch' 1"
		cset "name='aw882xx_copp_switch' 1"
		cset "name='aw_dev_0_switch' 1"
		cset "name='aw_dev_1_switch' 1"
		# The amp volume is an attenuation (0 = full); PipeWire does the rest.
		cset "name='aw_dev_0_volume' 0"
		cset "name='aw_dev_1_volume' 0"
	]

	DisableSequence [
		cset "name='aw_dev_0_switch' 0"
		cset "name='aw_dev_1_switch' 0"
		cset "name='aw882xx_copp_switch' 0"
		cset "name='aw882xx_rx_switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:LenovoY700TB321,1"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	Include.wcdhpe.File "/codecs/wcd939x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd939x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	EnableSequence [
		cset "name='MBHC Switch' 1"
		cset "name='CLSH Switch' 0"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:LenovoY700TB321,0"
		PlaybackMixer "default:LenovoY700TB321"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	Include.wcdhsmice.File "/codecs/wcd939x/HeadphoneMicEnableSeq.conf"
	Include.wcdhsmicd.File "/codecs/wcd939x/HeadphoneMicDisableSeq.conf"
	Include.txmhse.File "/codecs/qcom-lpass/tx-macro/SoundwireMic1EnableSeq.conf"
	Include.txmhsd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	ConflictingDevice [
		"Mic1"
	]

	Value {
		CaptureChannels 2
		CapturePriority 300
		CapturePCM "hw:LenovoY700TB321,2"
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
	}
}

SectionDevice."Mic1" {
	Comment "Internal microphone"

	Include.wcdmice.File "/codecs/wcd939x/AnalogMic1EnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd939x/AnalogMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/SoundwireMic0EnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/SoundwireMicDisableSeq.conf"

	ConflictingDevice [
		"Headset"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:LenovoY700TB321,2"
		CaptureMixerElem "ADC1"
	}
}
