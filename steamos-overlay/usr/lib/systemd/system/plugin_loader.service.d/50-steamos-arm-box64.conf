# Decky's PluginLoader is an x86-64 build and runs through box64 here.
# Updating Decky from its settings writes Decky's own unit to
# /etc/systemd/system, which wins over ours in /usr/lib and starts the
# binary directly: "Exec format error" and no plugin opens. A drop-in
# applies on top of whichever unit file wins, so the update can't undo it.
[Service]
ExecStart=
ExecStart=/usr/local/bin/box64 /home/steamos/homebrew/services/PluginLoader
