# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/capability_map_v2.json
# Our aya-keys gpio-keys node (kernel-sm8550/dts/qcs8550-ayaneo-pocketevo.dts.append)
# sends these codes; LC/RC are L4/R4 like on the Pocket FIT, the menu button L5.
version: 2
kind: CapabilityMap
name: AYANEO Pocket EVO side keys
id: ayaneo_pocket_evo_keys
mapping:
- name: AYANEO button -> Quick Access
  source_events:
  - evdev:
      event_type: KEY
      event_code: KEY_F13
      value_type: button
  target_event:
    gamepad:
      button: QuickAccess
- name: Menu -> L5
  source_events:
  - evdev:
      event_type: KEY
      event_code: KEY_F14
      value_type: button
  target_event:
    gamepad:
      button: LeftPaddle2
- name: LC -> L4
  source_events:
  - evdev:
      event_type: KEY
      event_code: KEY_F15
      value_type: button
  target_event:
    gamepad:
      button: LeftPaddle1
- name: RC -> R4
  source_events:
  - evdev:
      event_type: KEY
      event_code: KEY_F16
      value_type: button
  target_event:
    gamepad:
      button: RightPaddle1
filtered_events: []
