# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# Retroid Pocket 6 / 6 TOP-DPAD / Nova (SM8550) → virtual Steam Deck controller.
# Same RSInput serial pad as the AYN Odin 2 (qcs8550-ayn-common.dtsi), but
# the face buttons come in the other way round, so it has its own
# retroid_mcu map. The two back paddles are gpio-keys (BTN_Z / BTN_C,
# next to Volume Up) → L4 / R4. Unmapped keys (volume) pass through to the
# keyboard target.
version: 1
kind: CompositeDevice
name: Retroid Pocket

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Retroid Pocket 6
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Retroid Pocket 6 TOP-DPAD
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: Retroid Pocket Nova

single_source: false

source_devices:
  - group: gamepad
    evdev:
      phys_path: rsinput-gamepad/input0
      handler: event*
    capability_map_id: retroid_mcu
  - group: gamepad
    evdev:
      name: gpio-keys
      phys_path: gpio-keys/input0
      handler: event*
    capability_map_id: retroid_mcu

options:
  auto_manage: true

target_devices:
  - deck-uhid
  - keyboard
