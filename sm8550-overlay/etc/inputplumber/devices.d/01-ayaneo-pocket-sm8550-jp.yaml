# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# AYANEO Pocket ACE / DMG (SM8550, Nintendo-style A/B) → virtual Steam Deck controller.
# XInput pad (045e:028e) plus the "AYANEO DEVICE" (1c4f:0002) for the extra
# keys, same device list ROCKNIX uses.
# Buttons map by position, like a Deck: Steam's own "Nintendo button layout"
# switch then puts A and B the way they're printed. Swapping them here
# (the old ayaneo_sm8550_deck_jp map) showed the wrong glyphs with Universal
# Glyphs on (Pocket DMG tester).
version: 1
kind: CompositeDevice
name: AYANEO Pocket ACE-DMG

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYANEO Pocket ACE
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYANEO Pocket DMG

single_source: false

source_devices:
  - group: gamepad
    evdev:
      vendor_id: "1c4f"
      product_id: "0002"
      handler: event*
    # Two event devices (input0 and input1): both join this controller.
    # With the default unique: true the second one became a second
    # virtual pad (two controllers, A/B "swapping" on the Pocket DMG).
    unique: false
    capability_map_id: ayaneo_sm8550_deck
  - group: gamepad
    evdev:
      vendor_id: "045e"
      product_id: "028e"
      handler: event*
    capability_map_id: ayaneo_sm8550_deck
  # Firmware that boots the pad in DirectInput mode, like the Pocket S2.
  - group: gamepad
    evdev:
      vendor_id: "4001"
      product_id: "0428"
      handler: event*
    capability_map_id: konkr_pocketfit_dinput
  - group: gamepad
    hidraw:
      vendor_id: 0x4001
      product_id: 0x0428
      interface_num: 0

options:
  auto_manage: true

target_devices:
  - deck-uhid
  - keyboard
